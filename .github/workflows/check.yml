# MAHITO_PLAN §0b in CI: the same `make check` the pre-commit hook runs, with NO real data.
# Rust vs Python parity runs here on seeded simulated chunks (tests/test_sim_parity.py: full replays, all 8 switch
# combinations; the simulator writes the real formats) and through the differential tests (test_rust_engine.py,
# test_rust_book.py, test_replay_core.py). Tests that need the dev20 data (~/hl-data/mac3) skip themselves
# (checked: 541 passed, 19 skipped with no data); full dev20 parity is `make checkpoint`, run where the data lives.
name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Python env
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -e . pytest hypothesis "maturin==1.8.1"
      - name: Build replay_core into the venv
        run: make rust
      - name: make check
        run: make check
