[project]
name = "book-replay"
version = "0.1.0"
description = "Rebuild Hyperliquid's order book from its public transaction log, rerun history under other ordering rules, and prove every engine version produces identical state."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sortedcontainers>=2.4",   # SortedDict price levels in engine_py/book.py
    "lz4>=4.3",                # decompress replica_cmds blocks
    "pandas>=2.2",             # replay validation + experiment tables
    "statsmodels>=0.14",       # regression with clustered standard errors
    "matplotlib>=3.9",         # report figures
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",       # property-based invariant tests
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine_py", "data", "analysis"]
